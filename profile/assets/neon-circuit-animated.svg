<svg xmlns="http://www.w3.org/2000/svg" width="1436" height="490" viewBox="0 0 1436 490" role="img" aria-label="Animated neon coding and infinity emblem">
<style>
.logo { animation: breathe 4s ease-in-out infinite; transform-origin: 50% 50%; }
.neon-fog { animation: fog 4s ease-in-out infinite; }
.spark { fill: none; stroke: #fff3ff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 14 480; animation: run 4s linear infinite; }
.spark.two { animation-delay: -1.1s; }
.spark.three { animation-delay: -2.0s; }
.spark.four { animation-delay: -2.9s; }
@keyframes breathe { 0%,100% { opacity: .92; } 50% {opacity: 1; } }
@keyframes fog { 0%,100% { opacity: .55; } 50% {opacity: .95; } }
@keyframes run { 0% {stroke-dashoffset: 500; opacity: 0;} 10%,85% {opacity: .9;} 100% {stroke-dashoffset: 0; opacity: 0;} }
@media (prefers-reduced-motion: reduce) { .logo,.neon-fog,.spark { animation: none; } .spark { opacity: 0; } }
</style>
